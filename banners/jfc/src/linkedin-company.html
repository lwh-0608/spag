<!doctype html>

<title>JFC · LinkedIn company page cover · 1512×256</title>
<link rel="stylesheet" href="../../kit/css/base.css">

<style>
  .art { width: 1512px; height: 256px; }

  /* white leaf silhouette, bled from the top-right corner */

  .jfc .lc-logo { position: absolute; left: 56px; top: 32px; height: 44px; }

  .jfc .lc-kicker { position: absolute; left: 58px; top: 96px; font-size: 11px; }

  .jfc .lc-h1 { position: absolute; left: 52px; top: 120px; font-size: 38px; }

  .jfc .lc-h1-en { position: absolute; left: 58px; top: 170px; font-size: 17px; }

  .jfc .lc-contact { position: absolute; right: 56px; top: 44px; text-align: right; font-size: 15px; }

  .jfc .lc-meta { position: absolute; right: 56px; top: 72px; text-align: right; }

  .jfc .lc-service { position: absolute; right: 56px; top: 168px; text-align: right; font-size: 11.5px; }

  .jfc .lc-service-en { position: absolute; right: 56px; top: 192px; text-align: right; font-size: 11px; }

</head>
<body>
<div class="art jfc">
